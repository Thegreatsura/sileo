name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sileo
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      # The site is a workspace member and depends on a licensed registry, and
      # bun resolves the whole workspace even when installing from inside the
      # package — so a release needs those credentials too. Safe here: a release
      # is published by a maintainer, so this never runs from a fork.
      - name: Authenticate private registry
        run: |
          if [ -n "$NPM_RC" ]; then printf '%s\n' "$NPM_RC" > ~/.npmrc; fi
        env:
          NPM_RC: ${{ secrets.NPM_RC }}

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Verify build
        run: ls -la dist/

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
